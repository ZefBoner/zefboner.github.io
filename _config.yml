# Configuración del sitio de Angxdes
# Tema: Chirpy › https://github.com/cotes2020/jekyll-theme-chirpy

theme: jekyll-theme-chirpy

# Idioma de la interfaz (usa _data/locales/es-ES.yml del tema)
lang: es-ES

# Zona horaria › https://zones.arilyn.cc
timezone: America/Mexico_City

# jekyll-seo-tag › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Angxdes

tagline: Writeups de HackTheBox, Sherlocks, CTFs y laboratorios

description: >-
  Writeups y notas de Angxdes: máquinas y Sherlocks de HackTheBox, retos de CTF,
  TryHackMe y laboratorios de seguridad ofensiva y defensiva.

# Protocolo + dominio del sitio, sin "/" al final.
url: "https://zefboner.github.io"

github:
  username: ZefBoner

twitter:
  username: # tu usuario de X/Twitter, si quieres que aparezca

social:
  # Autor por defecto de los posts y dueño del copyright en el footer
  name: Angxdes
  email: # opcional; si lo llenas, activa también el contacto "email" en _data/contact.yml
  fediverse_handle:
  links:
    # El primer enlace es el del dueño del copyright
    - https://github.com/ZefBoner
    # - https://app.hackthebox.com/profile/TU_ID
    # - https://www.linkedin.com/in/tu-usuario

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# Fondo oscuro siempre (sin botón para cambiar a claro).
# Déjalo vacío si prefieres que siga el tema del sistema y aparezca el botón.
theme_mode: dark

cdn:

# Avatar de la barra lateral (cámbialo por tu foto o logo cuando quieras)
avatar: /assets/img/avatar.svg

# Imagen por defecto al compartir enlaces (PNG o JPG de 1200x630)
social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  # Para activar comentarios con GitHub Discussions, pon "giscus" y llena los datos
  # que te da https://giscus.app (ver README).
  provider: # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo: # ZefBoner/ZefBoner.github.io
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ Lo de abajo normalmente no se toca ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - borradores
  - _plantillas
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
